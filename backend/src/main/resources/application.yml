spring:
  application:
    name: restart-quest-backend
  datasource:
    url: jdbc:h2:mem:restartquest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
server:
  error:
    include-message: never
    include-stacktrace: never
