spring:
  application:
    name: restart-quest-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restart_quest}
    username: ${DB_USER:restart_quest}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  session:
    ttl: 30d
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  session:
    cookie-secure: true

server:
  forward-headers-strategy: native
