services:
  db:
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: "${DB_NAME:-restart_quest}"
      POSTGRES_USER: "${DB_USER:-restart_quest}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: "${BACKEND_IMAGE:-restart-quest-backend}:${RELEASE_TAG:-local}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: "jdbc:postgresql://db:5432/${DB_NAME:-restart_quest}"
      DB_USER: "${DB_USER:-restart_quest}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --output-document=- http://127.0.0.1:8080/actuator/health
          | grep --quiet UP
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  frontend:
    image: "${FRONTEND_IMAGE:-restart-quest-frontend}:${RELEASE_TAG:-local}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --output-document=- http://127.0.0.1:8080/actuator/health
          | grep --quiet UP
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  postgres-data:
